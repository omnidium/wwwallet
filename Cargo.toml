[workspace]
resolver = "2"
members = [
    "backend",
    "backend/providers",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
worker = { version = "0.8", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"

[profile.release]
opt-level = "s"
