<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script>
      // The Pages project is also reachable at its default wwwallet.pages.dev
      // address; send it to the canonical domain. Exact-host match only, so
      // branch previews (<hash>.wwwallet.pages.dev) are left alone.
      if (location.hostname === 'wwwallet.pages.dev') {
        location.replace('https://app.wwwallet.me' + location.pathname + location.search + location.hash)
      }
    </script>
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#04918f">
    <meta name="description" content="A personal, non-custodial Ethereum/EVM wallet.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <title>wwwallet</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
