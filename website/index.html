<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1f1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4fbf8" media="(prefers-color-scheme: light)" />

    <title>wwwallet</title>
    <meta name="description" content="" />
    <!-- Filled in per language by the build (scripts/prerender.mjs): title,
         description, canonical and alternate-language links, link-preview
         tags and structured data. -->
    <!--seo-head-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />


    <!-- Blocking on purpose: sets the theme before the page paints. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Where panels and menus open (<Teleport to="#teleports">): a container
         of their own rather than <body>, which also holds the prerendered
         page — Vue couldn't tell where the one ends and the other begins. -->
    <div id="teleports"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
