name = "wwwallet-backend"
main = "build/worker/shim.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "worker-build --release"

# Non-secret config. Real provider API keys are set via `wrangler secret put`
# (production) or a local, gitignored `.dev.vars` file (local `wrangler dev`) —
# never here, since this file is committed.
[vars]
CORS_ALLOWED_ORIGINS = "https://wwwallet.pages.dev"

# Create with `wrangler kv namespace create CACHE`, then paste the returned id
# below. Used for short-TTL caching of provider responses — see providers/src/cache.rs.
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
