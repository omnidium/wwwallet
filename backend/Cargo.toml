[package]
name = "wwwallet-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }

wwwallet-providers = { path = "providers" }

# Session tokens (src/session.rs): HMAC-signed, stateless, minted by proof
# of work. getrandom's "js" feature draws from the Workers runtime's
# crypto.getRandomValues.
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
