name: website

on:
  push:
    paths:
      - 'website/**'
      - 'shared/i18n/**'
      - 'scripts/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'shared/i18n/**'
      - 'scripts/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # Every installed package must carry a valid npm registry signature
      # (and, where published, a provenance attestation that checks out) —
      # fails on a tampered or unsigned tarball before anything builds.
      - run: npm audit signatures
      # Offline, no DEEPL_API_KEY needed — fails loudly if en.ts has drifted
      # from shared/i18n/master_en.ts, or if a locale file is out of sync
      # with en.ts — same check as frontend's own (see that workflow).
      - run: node ../scripts/sync-i18n.mjs --check --project=website
      - run: npm run type-check
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit signatures
      - run: npm run build
      # No VITE_API_BASE_URL/VITE_GOOGLE_CLIENT_ID here — this site never calls
      # the backend Worker, it's fully static content.
      # wranglerVersion pinned for the same reason as frontend.yml/backend.yml —
      # this action's own update-check can silently fall back to an old bundled
      # wrangler in CI's sandboxed network instead of erroring.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          wranglerVersion: '4.131.1'
          command: pages deploy dist --project-name=wwwallet-website --branch=main
