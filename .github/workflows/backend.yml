name: backend

on:
  # Deliberately not path-filtered to backend/**: the frontend embeds the
  # repo's current commit as its version (see vite.config.ts) and now
  # redeploys on every commit too (see frontend.yml) — for that single
  # version to mean anything for both, both must actually redeploy on every
  # commit, not just when their own subtree changed.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Unit tests run on the host target — `worker` compiles there too, and
      # it's simpler than executing wasm inside workerd for pure-logic tests.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      # Compile-check against the actual deployment target.
      - run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install worker-build
      - run: cd backend && worker-build --release

  deploy:
    needs: [test, build-worker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install worker-build
      # wrangler.toml's [build] command runs worker-build itself as part of
      # `wrangler deploy` — this step just needs the binary on PATH.
      #
      # wranglerVersion is pinned deliberately: this action's own "is a newer
      # wrangler available" check can fail in CI's sandboxed network (no
      # confirmation prompt available), and it then silently falls back to a
      # much older bundled default (3.90.0) instead of erroring. That old
      # version doesn't understand this repo's [[ratelimits]] wrangler.toml
      # block at all ("Unexpected fields found... ratelimits") and just drops
      # it — deploying a Worker with no RATE_LIMITER_DEFAULT/_BROADCAST
      # binding, which then 500s on every request that checks it.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          wranglerVersion: '4.131.1'
          command: deploy
