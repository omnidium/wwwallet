name: backend

on:
  push:
    paths: ["backend/**", "Cargo.toml", "Cargo.lock", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "Cargo.toml", "Cargo.lock", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Unit tests run on the host target — `worker` compiles there too, and
      # it's simpler than executing wasm inside workerd for pure-logic tests.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      # Compile-check against the actual deployment target.
      - run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install worker-build
      - run: cd backend && worker-build --release

  deploy:
    needs: [test, build-worker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install worker-build
      # wrangler.toml's [build] command runs worker-build itself as part of
      # `wrangler deploy` — this step just needs the binary on PATH.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
