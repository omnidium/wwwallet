name: frontend

on:
  # Deliberately not path-filtered to frontend/**: the deployed frontend
  # embeds the repo's current commit as its version (see vite.config.ts),
  # and the backend deploys on every commit too (see backend.yml) — for that
  # single version to mean anything for both, both must actually redeploy
  # on every commit, not just when their own subtree changed.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Every installed package must carry a valid npm registry signature
      # (and, where published, a provenance attestation that checks out) —
      # fails on a tampered or unsigned tarball before anything builds.
      - run: npm audit signatures
      # Offline, no DEEPL_API_KEY needed — fails loudly if en.ts has drifted
      # from shared/i18n/master_en.ts (the real source of truth), or if a
      # locale file picked up a string that never got run through the DeepL
      # sync, so a locale silently falling back to English (see
      # scripts/lib/localeSync.mjs's own comment) gets caught here instead
      # of shipping unnoticed.
      - run: node ../scripts/sync-i18n.mjs --check --project=frontend
      - run: npm run type-check
      - run: npm run lint
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      - run: npx playwright test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit signatures
      # VITE_* vars are baked in at build time, not read at runtime — this
      # repo's real value only ever lived in a gitignored .env.production,
      # which a local `wrangler pages deploy` (this project's only deploy
      # path before this workflow existed) picked up automatically. CI has
      # no such file, so it must come from a secret instead.
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      # The Cloudflare Pages project's configured production branch is
      # "master", a name predating this repo's switch to "main" — pinning
      # --branch here keeps deploys landing in Production regardless of
      # what this repo's own default branch is called.
      # wranglerVersion pinned for the same reason as backend.yml — this
      # action's own update-check can silently fall back to an old bundled
      # wrangler in CI's sandboxed network instead of erroring.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          wranglerVersion: '4.131.1'
          command: pages deploy dist --project-name=wwwallet --branch=master
