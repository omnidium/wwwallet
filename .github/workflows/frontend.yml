name: frontend

on:
  push:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      - run: npx playwright test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # VITE_* vars are baked in at build time, not read at runtime — this
      # repo's real value only ever lived in a gitignored .env.production,
      # which a local `wrangler pages deploy` (this project's only deploy
      # path before this workflow existed) picked up automatically. CI has
      # no such file, so it must come from a secret instead.
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      # The Cloudflare Pages project's configured production branch is
      # "master", a name predating this repo's switch to "main" — pinning
      # --branch here keeps deploys landing in Production regardless of
      # what this repo's own default branch is called.
      # wranglerVersion pinned for the same reason as backend.yml — this
      # action's own update-check can silently fall back to an old bundled
      # wrangler in CI's sandboxed network instead of erroring.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          wranglerVersion: '4.131.1'
          command: pages deploy dist --project-name=wwwallet --branch=master
